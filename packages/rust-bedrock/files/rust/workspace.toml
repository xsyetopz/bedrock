# Managed by rust-bedrock. Every level is deny rather than forbid, so a crate can
# opt out of one lint with a crate-root #![expect(lint, reason = "…")].
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
# Docs are required on the public API only: rustc and Clippy skip pub(crate)
# and private items, and unreachable_pub makes `pub` mean public.
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unit_bindings = "deny"
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Pedantic includes missing_panics_doc and missing_errors_doc: a public function
# documents its `# Panics` and `# Errors`.
pedantic = { level = "deny", priority = -1 }
# Pedantic lints that flag readable code more often than bugs.
must_use_candidate = "allow"
similar_names = "allow"
match_same_arms = "allow"
if_not_else = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
# Nursery lints with no false positives seen on 1.99.
branches_sharing_code = "deny"
collection_is_never_read = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
needless_collect = "deny"
set_contains_or_insert = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
use_self = "deny"
while_float = "deny"
# Only `#[expect(lint, reason = "…")]` may silence a lint.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Restriction lints for panics, output, ignored results, and unsafe code.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "deny"
tests_outside_test_module = "deny"
mod_module_files = "deny"
as_underscore = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# Cargo manifest lints.
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

# Checked by `cargo doc`: broken links, public docs that link to private items,
# and malformed code blocks and HTML.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
panic = "abort"
overflow-checks = true
