org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
# AGP registers Compose Preview tasks for every variant, and they fail without the variant's unit
# tests. bedrockTest still runs only the debug ones.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Kotlin 2.4's Kotlin/Native toolchain resolution uses an attribute type Gradle 10 rejects; the
# direct download gets the same compiler into ~/.konan.
kotlin.native.toolchain.enabled=false
# bedrock.kotlin-native turns the cache off on macOS on purpose; see its comment.
kotlin.suppressGradlePluginWarnings=NativeCacheDisabledDiagnostic
