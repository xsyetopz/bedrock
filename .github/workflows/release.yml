name: Release

# Each check workflow's completion triggers this; the last one to pass on a commit releases it.
# Running it by hand releases the head of main, once its checks have passed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Base, Rust, Swift, TypeScript]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for every check on the commit
        id: checks
        run: |
          passed=$(gh run list --commit "$SHA" --event push --json workflowName,conclusion \
            --jq '[.[] | select(.conclusion == "success") | .workflowName] | unique | join(" ")')
          if [[ "$passed" == "Base Rust Swift TypeScript" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only [$passed] passed on $SHA so far; the last check to pass releases it."
          fi
      - if: steps.checks.outputs.passed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - if: steps.checks.outputs.passed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Adopted TypeScript repos install typescript-bedrock from npm, so it publishes
      # before any tag. npm trusts this workflow, so it needs no token; bun publish has no
      # trusted publishing, so Bun packs it, which resolves catalog: versions, and npm
      # publishes the tarball. A rerun skips a version npm already has.
      - name: Publish typescript-bedrock to npm
        if: steps.checks.outputs.passed == 'true'
        working-directory: packages/typescript-bedrock
        run: |
          version=$(jq -r .version package.json)
          if [[ "$(bunx npm@11.20.0 view "typescript-bedrock@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "typescript-bedrock@$version is already on npm"
          else
            bunx npm@11.20.0 publish "$(bun pm pack --quiet --destination "$RUNNER_TEMP")"
          fi
      - name: Tag each bedrock version that has no release
        if: steps.checks.outputs.passed == 'true'
        run: |
          release() {
            if [[ -z "$2" ]]; then
              echo "No version found for $1" >&2
              exit 1
            fi
            if gh release view "$1-v$2" >/dev/null 2>&1; then
              echo "$1-v$2 is already released"
            else
              gh release create "$1-v$2" --target "$SHA" --title "$1 v$2" --generate-notes --latest=false
            fi
          }
          release typescript-bedrock "$(jq -r '.version // empty' packages/typescript-bedrock/package.json)"
          release rust-bedrock "$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/rust-bedrock/Cargo.toml | head -n 1)"
          release swift-bedrock "$(sed -n 's/^let version = "\(.*\)"$/\1/p' packages/swift-bedrock/Sources/SwiftBedrock/Files.swift)"
