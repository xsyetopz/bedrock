name: Release

# Each check workflow's completion triggers this; the last one to pass on a commit releases it.
# Running it by hand releases the head of main, once its checks have passed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Base, Go, TypeScript, E2E]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for every check on the commit
        id: checks
        run: |
          passed=$(gh run list --commit "$SHA" --event push --json workflowName,conclusion \
            --jq '[.[] | select(.conclusion == "success") | .workflowName] | unique | join(" ")')
          if [[ "$passed" == "Base E2E Go TypeScript" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only [$passed] passed on $SHA so far; the last check to pass releases it."
          fi
      - if: steps.checks.outputs.passed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Skip a version that is already released
        if: steps.checks.outputs.passed == 'true'
        id: version
        run: |
          version=$(jq -r .version package.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.version.outputs.version != ''
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
      # `just setup` in adopted repos downloads these assets and checks them against SHA256SUMS.
      - name: Build and release the binaries
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          just dist
          gh release create "v$VERSION" dist/* --target "$SHA" --title "bedrock v$VERSION" --generate-notes
