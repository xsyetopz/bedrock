# This repo's own workflow, not a bedrock template: each job inits every kind of
# one language and runs its real toolchain, as the e2e tests do locally.
name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# The e2e tests skip themselves unless this is set, so `just verify` stays a unit run.
env:
  BEDROCK_E2E: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.language }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 60 }}
    # A job per platform a kind builds for: each e2e test builds the platforms its
    # host and installed SDKs reach and skips the rest, so the same `go test` run
    # covers @linux on Ubuntu, @windows on Windows, and the Apple platforms on Xcode.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun installs, type-checks, lints, and tests each kind; bun build --compile
          # cross-compiles the cli and server kinds for linux, macos, and windows.
          - language: typescript
            os: ubuntu-latest
          # rustup installs the pinned toolchain and each platform's targets from rust-toolchain.toml.
          # A kind builds for every platform it lists; a cross build without its linker skips, and
          # each host links its own: @linux and @android here, @ios and @macos on Xcode, @windows
          # with MSVC.
          - language: rust
            os: ubuntu-latest
            timeout: 100
            test-timeout: 90m
          - language: rust
            os: xcode-27
            timeout: 100
            test-timeout: 90m
          - language: rust
            os: windows-latest
            timeout: 100
            test-timeout: 90m
          # The Android SDK the runner ships builds the android, cmp, and kmp kinds. The runner's
          # JDK 17 starts Gradle, which fetches the JDK 25 daemon and GraalVM toolchains itself.
          - language: jvm
            os: ubuntu-latest
          # Kotlin/Native builds and tests the @ios and @macos targets of kmp, cmp, and
          # kotlin-native on macOS, and @windows on Windows; other hosts compile them only.
          - language: jvm
            os: xcode-27
          - language: jvm
            os: windows-latest
          # The swift tests build Swift 6.4 packages, the C++ interop, and the app for every
          # Apple platform with Xcode 27.
          - language: swift
            os: xcode-27
          # Go and golangci-lint run the starter files through the same format and lint recipes,
          # and go::build cross-compiles each platform; wasmtime runs the wasi build.
          - language: go
            package: golang
            os: ubuntu-latest
          # gomobile binds library@ios with the iOS SDK.
          - language: go
            package: golang
            os: xcode-27
          # CMake and Meson build the C test projects; the xmake cases skip without xmake. The
          # presets build @linux here, @android with the runner's NDK, @wasi with wasi-sdk, and
          # @wasm with emsdk.
          - language: cpp
            os: ubuntu-latest
          # The Apple presets build with the Xcode generator.
          - language: cpp
            os: xcode-27
          - language: cpp
            os: windows-latest
          # Haxe type-checks and runs an interpreter test; checkstyle and the formatter run the style
          # case. hxcpp builds command@<host>, since it does not cross-compile.
          - language: haxe
            os: ubuntu-latest
          - language: haxe
            os: xcode-27
          - language: haxe
            os: windows-latest
          # The .NET 10 SDK builds, lints, and tests each kind; dotnet tool restore fetches the
          # formatters. The runner's Android SDK has the android-36 platform the android kinds target.
          - language: dotnet
            os: ubuntu-latest
            workloads: android wasm-tools
          # The apple kind and avalonia@ios take 3 to 15 minutes a build.
          - language: dotnet
            os: xcode-27
            workloads: ios maccatalyst macos tvos wasm-tools
            timeout: 150
            test-timeout: 140m
          - language: dotnet
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # uv installs the pinned Meson the cpp tests build with, and runs the pinned
      # lizard that bedrock guard bounds sizes with.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,uv@0.13.7
      # bedrock is a Go program; each job runs one language's tests, e2e included.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # wasmtime runs the go command@wasi build and the cpp @wasi tests.
      - if: (matrix.language == 'go' || matrix.language == 'cpp') && runner.os == 'Linux'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasmtime@50.0.1
      # The Meson introspection the test-file split reads matches the version tested locally.
      # The starter .clang-format and .clang-tidy target LLVM 23, which apt.llvm.org packages
      # for Ubuntu with run-clang-tidy and clang-apply-replacements in /usr/lib/llvm-23/bin.
      - if: matrix.language == 'cpp' && runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get install -y --no-install-recommends ninja-build clang-format-23 clang-tidy-23 clang-tools-23
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          uv tool install cmake==3.31.6
          uv tool install meson==1.12.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # wasi-sdk builds the @wasi presets and emsdk the @wasm ones; the tests skip
      # each platform whose WASI_SDK_PATH or EMSDK is unset. The runner sets
      # ANDROID_NDK_HOME for the @android presets.
      - if: matrix.language == 'cpp' && runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          git clone --depth 1 --branch 7.0.0 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      # The recipes run Homebrew's current llvm, as cpp::setup installs it; CMake and Ninja
      # come with the image.
      - if: matrix.language == 'cpp' && runner.os == 'macOS'
        run: |
          brew install llvm
          uv tool install meson==1.12.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Cargo links the @android targets with the NDK's clang for API 24, the
      # level the cpp @android preset builds for.
      - if: matrix.language == 'rust' && runner.os == 'Linux'
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$bin/x86_64-linux-android24-clang" >> "$GITHUB_ENV"
      - if: matrix.language == 'haxe'
        uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb # v2.1.1
        with:
          haxe-version: 4.3.7
      # The pinned versions just haxe::setup installs, into the global repo the tests run outside.
      - if: matrix.language == 'haxe'
        run: |
          haxelib install checkstyle 2.9.0 --always
          haxelib install formatter 1.18.0 --always
      - if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # The workloads the platform kinds build with; each test skips a platform whose workload is absent.
      - if: matrix.workloads
        run: dotnet workload install ${{ matrix.workloads }}
      - run: go test -timeout ${{ matrix.test-timeout || '50m' }} "./internal/languages/${{ matrix.package || matrix.language }}/..."
