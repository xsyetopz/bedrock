# This repo's own workflow, not a bedrock template: each job inits every kind of
# one language and runs its real toolchain, as the e2e tests do locally.
name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-latest
          # The Android SDK the runner ships builds the android, cmp, and kmp kinds. The runner's
          # JDK 17 starts Gradle, which fetches the JDK 25 daemon and GraalVM toolchains itself.
          - language: jvm
            os: ubuntu-latest
          # The swift tests build Swift 6.4 packages, and the C++ interop, with Xcode 27.
          - language: swift
            os: xcode-27
          # Go and golangci-lint run the starter files through the same format and lint recipes.
          - language: go
            os: ubuntu-latest
          # CMake and Meson build the C test projects; the xmake cases skip without xmake.
          - language: cpp
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # uv runs the pinned lizard that bedrock guard bounds sizes with.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,uv@0.13.7
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The Meson introspection the test-file split reads matches the version tested locally.
      - if: matrix.language == 'cpp'
        run: |
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          uv tool install meson==1.12.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun test "cli/src/languages/${{ matrix.language }}/e2e.test.ts"
