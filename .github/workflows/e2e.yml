# This repo's own workflow, not a bedrock template: each job inits every kind of
# one language and runs its real toolchain, as the e2e tests do locally.
name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-latest
          # The Android SDK the runner ships builds the android, cmp, and kmp kinds. The runner's
          # JDK 17 starts Gradle, which fetches the JDK 25 daemon and GraalVM toolchains itself.
          - language: jvm
            os: ubuntu-latest
          # The swift tests build Swift 6.4 packages, and the C++ interop, with Xcode 27.
          - language: swift
            os: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.59.0
      - run: bun install --frozen-lockfile
      - run: bun test "cli/src/languages/${{ matrix.language }}/e2e.test.ts"
