version: 2
updates:

# >>> bedrock
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
# <<< bedrock

# >>> rust-bedrock
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
# <<< rust-bedrock

# >>> typescript-bedrock
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns: ["*"]
# <<< typescript-bedrock

# >>> swift-bedrock
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
# <<< swift-bedrock
