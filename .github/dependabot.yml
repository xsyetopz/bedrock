version: 2
updates:

# >>> bedrock
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
# <<< bedrock

# >>> typescript-bedrock
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns: ["*"]
# <<< typescript-bedrock

# >>> go-bedrock
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
# <<< go-bedrock
